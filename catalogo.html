<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo | Pulpería Las 3D</title><style>body{font-family:system-ui;margin:0;background:#eaf8ff;color:#174d76}header{background:linear-gradient(110deg,#0874c7,#59c5ec);color:white;padding:24px;text-align:center}.wrap{max-width:850px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.card{background:white;border-radius:15px;padding:12px;box-shadow:0 3px 10px #1c659422}.card img{width:100%;height:135px;object-fit:contain}.btn{border:0;background:#0874c7;color:white;border-radius:10px;padding:10px;margin-top:7px}input{padding:9px;border:1px solid #b8d7e9;border-radius:9px;max-width:100%}.cart{background:white;border-radius:15px;padding:14px;margin:16px 0}.muted{color:#567b93;font-size:13px}</style></head><body><header><h1>🛒 Pulpería Las 3D</h1><p>¡Elegí tus productos y pedí por WhatsApp!</p></header><main class="wrap"><p id="status">Cargando productos…</p><div id="products" class="grid"></div><div class="cart"><h2>🛍️ Tu pedido</h2><div id="cart"></div><label>Tu nombre: <input id="client" placeholder="Nombre"></label><p id="total"></p><button class="btn" onclick="send()">Enviar pedido por WhatsApp</button></div><p class="muted">Los precios y existencias pueden cambiar. Tu pedido se confirma cuando el negocio te responde.</p></main><script>let products=[],cart={};const money=n=>'C$'+Number(n).toLocaleString('es-NI',{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('catalogo.json?ts='+Date.now()).then(r=>{if(!r.ok)throw Error('Catálogo no publicado');return r.json()}).then(d=>{products=Array.isArray(d.products)?d.products:[];document.getElementById('status').textContent=products.length?'Productos disponibles':'Aún no hay productos publicados';document.getElementById('products').innerHTML=products.map((p,i)=>`<div class="card">${p.image?`<img src="${p.image}" alt="${esc(p.name)}">`:''}<b>${esc(p.name)}</b><p class="muted">${esc(p.brand||'')} · ${esc(p.unit||'unidad')}</p><b>${money(p.price)}</b><br><button class="btn" onclick="add(${i})" ${Number(p.stock)<=0?'disabled':''}>${Number(p.stock)>0?'Agregar +':'Agotado'}</button></div>`).join('')}).catch(()=>document.getElementById('status').textContent='No se pudo cargar el catálogo.');function add(i){let p=products[i];if((cart[i]||0)>=p.stock)return alert('No hay más unidades disponibles');cart[i]=(cart[i]||0)+1;draw()}function draw(){let total=0;document.getElementById('cart').innerHTML=Object.entries(cart).map(([i,q])=>{let p=products[i];total+=p.price*q;return `<p>${esc(p.name)} × ${q} — ${money(p.price*q)} <button onclick="delete cart[${i}];draw()">Quitar</button></p>`}).join('')||'<p>Tu carrito está vacío</p>';document.getElementById('total').textContent='Total: '+money(total)}function send(){let items=Object.entries(cart);if(!items.length)return alert('Agregá productos');let name=document.getElementById('client').value.trim();if(!name)return alert('Escribí tu nombre');let total=items.reduce((a,[i,q])=>a+products[i].price*q,0),body=`Hola, soy ${name}. Quiero hacer este pedido en Pulpería Las 3D:\n`+items.map(([i,q])=>`${products[i].name} x${q} — ${money(products[i].price*q)}`).join('\n')+`\nTotal: ${money(total)}`;window.open('https://wa.me/50576918637?text='+encodeURIComponent(body),'_blank')}draw();</script></body></html>
